# Nixpacks (Railway) no instala por defecto las librerías de sistema que
# Chrome headless necesita para arrancar. Sin esto, Puppeteer descarga el
# binario de Chrome durante el build pero falla al lanzarlo en runtime
# ("error while loading shared libraries"), rompiendo todos los reportes PDF
# (dashboard, inventario, POS, ticket, remito, gasto, historial, consignación).
[phases.setup]
aptPkgs = [
  "ca-certificates",
  "fonts-liberation",
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcairo2",
  "libcups2",
  "libdbus-1-3",
  "libexpat1",
  "libfontconfig1",
  "libgbm1",
  "libglib2.0-0",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxcomposite1",
  "libxcursor1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxi6",
  "libxrandr2",
  "libxrender1",
  "libxss1",
  "libxtst6",
  "wget",
  "xdg-utils",
]
