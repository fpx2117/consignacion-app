[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "atk",
  "at-spi2-atk",
  "cups",
  "drm",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "xorg.libxkbfile",
  "xorg.libXScrnSaver",
  "xorg.libXtst",
  "pango",
  "cairo",
  "glib",
  "gtk3",
  "alsa-lib",
  "fontconfig",
  "freetype",
  "libgbm",
  "expat",
]

[phases.install]
cmds = ["npm ci --omit=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
